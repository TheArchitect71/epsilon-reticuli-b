<header class="app-header">
  <a class="brand" routerLink="/overview">Epsilon Reticuli B<span>People workspace</span></a>
  <button *ngIf="auth.token" class="menu-toggle" type="button" (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-controls="main-navigation">Menu</button>
  <nav *ngIf="auth.token" id="main-navigation" aria-label="Main navigation" [class.open]="menuOpen">
    <a routerLink="/overview" routerLinkActive="selected" (click)="menuOpen = false">Overview</a>
    <a routerLink="/people" routerLinkActive="selected" (click)="menuOpen = false">People</a>
    <a routerLink="/about" routerLinkActive="selected" (click)="menuOpen = false">About</a>
    <button (click)="auth.logout(); menuOpen = false">Sign out</button>
  </nav>
</header>
<main id="main-content"><router-outlet></router-outlet></main>
<footer>Epsilon Reticuli B · Powered by Betazed MongoDB</footer>
